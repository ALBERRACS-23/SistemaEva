<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema EVA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-200">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5s3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tight">Sistema EVA</h1>
            <p class="text-slate-500 font-medium">Plataforma de Gestión de Notas</p>
        </div>

        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl shadow-slate-200/60 border border-slate-100">
            <h2 class="text-xl font-bold text-slate-700 mb-6 text-center">Bienvenido</h2>
            
            <button id="btnLoginGoogle" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-100 hover:border-indigo-100 hover:bg-indigo-50 text-slate-700 font-bold py-4 px-6 rounded-2xl transition-all duration-300 group">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-6 h-6" alt="Google">
                <span>Continuar con Google</span>
            </button>

            <div class="mt-8 text-center">
                <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Acceso exclusivo para personal</p>
            </div>
        </div>

        <p class="text-center mt-8 text-slate-400 text-sm">© 2024 Innovación Educativa</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwh4DIzzxRyPPzMxCZaIGcdywo-8_h5rk",
            authDomain: "eva-estudiantes.firebaseapp.com",
            databaseURL: "https://eva-estudiantes-default-rtdb.firebaseio.com",
            projectId: "eva-estudiantes",
            storageBucket: "eva-estudiantes.firebasestorage.app",
            messagingSenderId: "692305850400",
            appId: "1:692305850400:web:2b15a925a9669438ad8c45"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();


        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'registros.html';
            }
        });

        document.getElementById('btnLoginGoogle').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;


                const snapshot = await get(ref(db, `usuarios/${user.uid}`));
                
                if (snapshot.exists()) {
                    console.log("Usuario reconocido:", snapshot.val().rol);
                    window.location.href = 'registros.html';
                } else {
                  window.location.href = 'registros.html';
                }

            } catch (error) {
                console.error("Error en login:", error);
                alert("Hubo un error al intentar iniciar sesión.");
            }
        });
    </script>
</body>
</html>
